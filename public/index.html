<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CT Q4 Check</title>
  <meta name="description" content="Get your 2026 Q4 Growth Card." />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v={{ASSET_V}}" />
</head>
<body>
  <main class="wrap">
    <section class="card" id="card">
      <header class="brand" id="brand">
        <button type="button" id="homeLink" class="logo">CT Q4 Check</button>
        <p class="tagline" id="tagline">Get your 2026 Q4 Growth Card.</p>
      </header>

      <div id="home">
        <label class="field" for="handle">X username</label>
        <div class="input-wrap">
          <span>@</span>
          <input id="handle" type="text" maxlength="16" autocomplete="off" spellcheck="false" placeholder="username" />
        </div>
        <button class="go" id="startBtn" type="button">Check my Q4 🚀</button>
        <p class="err" id="homeErr"></p>
      </div>

      <div id="quiz" class="quiz hidden">
        <div class="quiz-top">
          <button type="button" class="back" id="backBtn">Back</button>
          <div class="step" id="stepLabel">1 of 8</div>
        </div>
        <div class="bar" aria-hidden="true"><div class="bar-fill" id="barFill"></div></div>
        <h2 class="question" id="question"></h2>
        <p class="hint hidden" id="quizHint"></p>
        <div class="options" id="options"></div>
        <div id="countWrap" class="count-wrap hidden">
          <input id="countInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="24" placeholder="Type a number" aria-label="Number" />
          <p class="err" id="countErr"></p>
        </div>
        <div id="otherWrap" class="other-wrap hidden">
          <label class="field" for="otherInput">In a few words</label>
          <input id="otherInput" type="text" maxlength="40" autocomplete="off" spellcheck="true" placeholder="What's getting in the way?" />
        </div>
        <button class="go hidden" id="continueBtn" type="button">Continue</button>
      </div>

      <div id="result" class="result hidden">
        <div id="shareCard" class="share-card">
          <div class="card-kicker">2026 · Your Q4 Growth Card</div>
          <div class="hero">
            <div class="pfp-wrap"><img id="pfp" alt="Profile picture" /></div>
            <div class="handle" id="youHandle"></div>
          </div>
          <div class="score-block">
            <div class="score-glow" aria-hidden="true"></div>
            <div class="score-ring">
              <div class="score-ring-inner">
                <div class="score" id="score"></div>
              </div>
            </div>
            <div class="label" id="label"></div>
          </div>
          <div class="chips" id="nicheChips"></div>
          <div class="stats" id="stats"></div>
          <div class="progress" id="progress"></div>
          <div class="box">
            <div class="box-label">Holding you back</div>
            <div class="chips" id="blockerChips"></div>
          </div>
          <div class="box open-box">
            <div class="box-label">Open to</div>
            <div class="chips" id="openChips"></div>
          </div>
          <div class="box">
            <div class="box-label">Q4 mission</div>
            <div class="chips" id="missionChips"></div>
          </div>
          <div class="box tips-box">
            <div class="box-label">Tips</div>
            <ul id="tips"></ul>
          </div>
          <div class="card-foot">
            <div class="card-url" id="cardUrl"></div>
          </div>
        </div>
        <div class="actions">
          <button class="share" id="downloadBtn" type="button">Download card</button>
          <a class="share" id="shareBtn" target="_blank" rel="noopener noreferrer">Share on X</a>
          <button class="again" id="againBtn" type="button">Check another</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-credit">Built by <a href="https://x.com/tenacious_ar" target="_blank" rel="noopener noreferrer">@tenacious_ar</a></footer>

  <div id="exportMount" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="/app.js?v={{ASSET_V}}"></script>
</body>
</html>
